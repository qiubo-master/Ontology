name: Deploy Ontology Platform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]
      resource_profile:
        description: Auditable resource profile
        required: true
        default: standard
        type: choice
        options: [small, standard, large]
      app_cpu:
        description: Application CPU limit
        required: true
        default: "2.0"
      app_memory:
        description: Application memory limit
        required: true
        default: 2g
      database_memory:
        description: Reserved for ForgeOps resource contract
        required: true
        default: 1g
      host_port:
        description: Shared public IP port or gateway upstream port
        required: true
        default: "8090"
      bind_address:
        description: 0.0.0.0 for direct access; 127.0.0.1 for host Nginx
        required: true
        default: 0.0.0.0
        type: choice
        options: [0.0.0.0, 127.0.0.1]

concurrency:
  group: ontology-platform-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py ontology

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested resources
        env:
          APP_CPU: ${{ inputs.app_cpu }}
          APP_MEMORY: ${{ inputs.app_memory }}
          HOST_PORT: ${{ inputs.host_port }}
          BIND_ADDRESS: ${{ inputs.bind_address }}
        run: |
          [[ "$APP_CPU" =~ ^(1\.0|2\.0|4\.0)$ ]]
          [[ "$APP_MEMORY" =~ ^(1g|2g|4g)$ ]]
          [[ "$HOST_PORT" =~ ^[0-9]{4,5}$ ]] && (( HOST_PORT >= 1024 && HOST_PORT <= 65535 ))
          [[ "$BIND_ADDRESS" == "0.0.0.0" || "$BIND_ADDRESS" == "127.0.0.1" ]]
      - name: Build deployment image
        if: inputs.action == 'deploy'
        run: |
          docker build -t "ontology-platform:${GITHUB_SHA}" .
          docker save "ontology-platform:${GITHUB_SHA}" | gzip -1 > "/tmp/ontology-platform-image-${GITHUB_SHA}.tar.gz"
      - name: Connect to deployment tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Package and upload release
        if: inputs.action == 'deploy'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          tar --exclude=.git --exclude=.codex-finalizer --exclude=.ppt-build --exclude=ppt-output -czf /tmp/ontology-platform.tgz .
          scp -i ~/.ssh/deploy_key -P "$PORT" /tmp/ontology-platform.tgz "$USER@$HOST:/tmp/ontology-platform-${GITHUB_SHA}.tgz"
          scp -i ~/.ssh/deploy_key -P "$PORT" "/tmp/ontology-platform-image-${GITHUB_SHA}.tar.gz" "$USER@$HOST:/tmp/ontology-platform-image-${GITHUB_SHA}.tar.gz"
      - name: Activate requested release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          ACTION: ${{ inputs.action }}
          APP_CPU: ${{ inputs.app_cpu }}
          APP_MEMORY: ${{ inputs.app_memory }}
          HOST_PORT: ${{ inputs.host_port }}
          BIND_ADDRESS: ${{ inputs.bind_address }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" \
            "ACTION=$ACTION RELEASE_SHA=$GITHUB_SHA ARCHIVE=/tmp/ontology-platform-${GITHUB_SHA}.tgz IMAGE_ARCHIVE=/tmp/ontology-platform-image-${GITHUB_SHA}.tar.gz ONTOLOGY_APP_CPU=$APP_CPU ONTOLOGY_APP_MEMORY=$APP_MEMORY ONTOLOGY_HOST_PORT=$HOST_PORT ONTOLOGY_BIND_ADDRESS=$BIND_ADDRESS bash -s" \
            < ops/deploy-ontology.sh

